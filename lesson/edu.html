<script>
(function(){
  var B=function(s){return atob(s);};
  var u=new URLSearchParams(location.search);
  var id=G.fromToken(u.get("m"));
  var g=(id>=0)?G.item(id):null;
  if(!g){location.replace("./");return;}

  document.title="Module — EduPlex";
  document.getElementById("title").src=G.nameImg(g.name,420,22,18);
  document.getElementById("tbtitle").src=G.nameImg(g.name,300,20,16);

  
  document.getElementById("srcmask").textContent="endpoint://"+G.token(g.id)+"."+
    btoa("r"+(g.id%97)).replace(/=/g,"").toLowerCase();

  var stage=document.getElementById("stage"),cover=document.getElementById("cover"),
      loader=document.getElementById("loader"),launch=document.getElementById("launch");
  cover.style.backgroundImage="url('"+g.icon+"')";

  
  setTimeout(function(){
    loader.style.display="none";
    launch.classList.add("ready");
  },2000);

  var frame=null;
  function mount(){
googletag.pubads().refresh();
    if(frame)return;
    frame=document.createElement(B("aWZyYW1l"));
    frame.className="frame";
    frame.setAttribute(B("YWxsb3c="), B("YXV0b3BsYXk7IGZ1bGxzY3JlZW47IGdhbWVwYWQ7IG1pY3JvcGhvbmU7IGNsaXBib2FyZC13cml0ZTsgYWNjZWxlcm9tZXRlcjsgZ3lyb3Njb3Bl"));
    frame.setAttribute(B("YWxsb3dmdWxsc2NyZWVu"),"");
    frame.setAttribute("scrolling","no");
    frame.src=g.src;                  
    stage.appendChild(frame);
    cover.style.display="none";
  }
  document.getElementById("biggo").addEventListener("click",mount);

  document.getElementById("reload").addEventListener("click",function(){
    if(frame){frame.src=g.src;} else mount();
  });
  document.getElementById("fs").addEventListener("click",function(){
    if(!frame)mount();
    var m=stage[B("cmVxdWVzdEZ1bGxzY3JlZW4=")]||stage.webkitRequestFullscreen||stage.msRequestFullscreen;
    if(m)m.call(stage);
  });

  
  var all=[],N=G.count();
  for(var i=0;i<N;i++) if(i!==id) all.push(G.item(i));
  var same=all.filter(function(x){return x.cat===g.cat;});
  var rest=all.filter(function(x){return x.cat!==g.cat;});
  var pick=G.shuffle(G.shuffle(same).slice(0,16).concat(G.shuffle(rest).slice(0,16))).slice(0,16);

  var ICO='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  var sim=document.getElementById("sim"),html="";
  pick.forEach(function(x){
    html+='<a class="card" href="edu.html?m='+encodeURIComponent(G.token(x.id))+'">'+
      '<img class="ic" loading="lazy" src="'+x.icon+'" alt="module">'+
      '<div class="go"><span>'+ICO+'</span></div>'+
      '<div class="lab"><img alt="" data-n="'+x.id+'"></div></a>';
  });
  sim.innerHTML=html;
  sim.querySelectorAll(".lab img[data-n]").forEach(function(im){
    var x=G.item(+im.getAttribute("data-n"));
    im.src=G.nameImg(x.name,150,18,13);
  });

  var q=document.getElementById("q");
  q.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&q.value.trim())location.href="./?q="+encodeURIComponent(q.value.trim());
  });
  document.getElementById("yr").textContent=new Date().getFullYear();
})();
</script>
