<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Game Route Not Found | Unblocked Games G+ Hub</title>
  <meta name="description" content="The requested page was not found. Return to the Unblocked Games G+ Hub or launch the 60 FPS HTML5 school Chromebook game vault directly.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#090c10">
  <style>
    :root {
      --bg-dark: #090c10;
      --card-bg: #11161f;
      --border: #1f2937;
      --accent-green: #00ff88;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      max-width: 540px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      background: rgba(0, 255, 136, 0.12);
      border: 1px solid rgba(0, 255, 136, 0.35);
      color: var(--accent-green);
      font-family: monospace;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.85rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--text-muted);
      line-height: 1.6;
      font-size: 0.95rem;
      margin-bottom: 1.75rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.4rem;
      border-radius: 10px;
      background: var(--accent-green);
      color: #05080b;
      font-weight: 800;
      font-size: 0.9rem;
      text-decoration: none;
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.4rem;
      border-radius: 10px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">HTTP 404 · G+ VAULT ROUTER</span>
    <h1>Game or Route Not Found</h1>
    <p>
      The URL you requested does not exist or has moved to our main HTML5 Chromebook vault. Launch the Unblocked Games G+ catalog below.
    </p>
    <div class="actions">
      <a href="https://agar-game.github.io/lesson/" class="btn-primary">Launch G+ Game Vault &rarr;</a>
      <a href="https://agar-game.github.io/" class="btn-secondary">Back to G+ Hub Home</a>
    </div>
  </main>
</body>
</html>
